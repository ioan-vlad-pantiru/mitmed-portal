name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  portal:
    name: portal (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mitmed-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mitmed-portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          API_BASE_URL: "http://localhost:8000"

  api:
    name: api (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mitmed-api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mitmed
          POSTGRES_PASSWORD: mitmed_test_password
          POSTGRES_DB: mitmed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mitmed"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: "postgresql+psycopg://mitmed:mitmed_test_password@localhost:5432/mitmed_test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mitmed-api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  deploy:
    name: deploy to production
    needs: [portal, api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      # No --delete: mitmed-api/.env (gitignored, holds production secrets)
      # lives only on the server and must survive every sync.
      - name: Sync files to server
        run: |
          rsync -az -e "ssh -i ~/.ssh/deploy_key" \
            --exclude 'node_modules' --exclude '.next' --exclude '.venv' --exclude '.git' \
            --exclude '__pycache__' --exclude '.pytest_cache' --exclude '*.pyc' --exclude '.DS_Store' \
            ./ "root@${{ secrets.DEPLOY_HOST }}:/root/mitmed-portal/"
      - name: Rebuild and restart stack
        run: |
          ssh -i ~/.ssh/deploy_key "root@${{ secrets.DEPLOY_HOST }}" \
            "cd /root/mitmed-portal && docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build"
